name: Schedule

on:
  schedule:
    # Daily at 11:15 UTC.
    #
    #         ┌───────────── minute           (0 - 59)
    #         │  ┌────────── hour             (0 - 23)
    #         │  │  ┌─────── day of the month (1 - 31)
    #         │  │  │  ┌──── month            (1 - 12 or JAN-DEC)
    #         │  │  │  │  ┌─ day of the week  (0 - 6 or SUN-SAT)
    #         │  │  │  │  │
    #         │  │  │  │  │
    #         │  │  │  │  │
    - cron: '15 11  *  *  *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: npm i

      - name: Update sponsors.svg
        run: npm run sponsors-svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save as a PNG
        run: npm run sponsors-png

      - name: Generate PNGs from SVG logos
        run: npm run pngs

      - name: Commit
        uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # v9.1.4
        with:
          message: 'Update sponsors image'
          add: 'sponsors.svg sponsors.png assets/sponsors'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
