name: Schedule

on:
  schedule:
    # Daily at 11:15 UTC.
    #
    #         ┌───────────── minute           (0 - 59)
    #         │  ┌────────── hour             (0 - 23)
    #         │  │  ┌─────── day of the month (1 - 31)
    #         │  │  │  ┌──── month            (1 - 12 or JAN-DEC)
    #         │  │  │  │  ┌─ day of the week  (0 - 6 or SUN-SAT)
    #         │  │  │  │  │
    #         │  │  │  │  │
    #         │  │  │  │  │
    - cron: '15 11  *  *  *'
  workflow_dispatch:

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Needed so the Commit step below can push back to the repo.
          persist-credentials: true

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Update sponsors.svg
        run: npm run sponsors-svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save as a PNG
        run: npm run sponsors-png

      - name: Generate PNGs from SVG logos
        run: npm run pngs

      - name: Commit
        run: | #shell
          # The GitHub avatar CDN returns subtly different JPEG bytes for the same
          # avatar across runs which would otherwise produce a daily commit even when
          # nothing visually changed. This ignores those small variances.
          png_noise_threshold=50
          old_size=$(git cat-file -p HEAD:sponsors.png | wc -c)
          new_size=$(wc -c < sponsors.png)
          png_delta=$(( new_size - old_size ))
          png_delta=${png_delta#-}
          if [ "$png_delta" -lt "$png_noise_threshold" ]; then
            echo "sponsors.png delta is $png_delta bytes (< $png_noise_threshold) — discarding."
            git checkout HEAD -- sponsors.svg sponsors.png
          fi
          git add sponsors.svg sponsors.png assets/sponsors
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update sponsors image'
            git push
          fi
